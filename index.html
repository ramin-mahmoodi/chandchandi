<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>چندچندی؟ | قیمت لحظه‌ای ارز، طلا و رمزارز</title>
  
  <meta name="description" content="قیمت لحظه‌ای بازار ارزهای فیات، طلا، سکه و ارزهای دیجیتال بر پایه API الان‌چند با معماری نئوبروتالیسم">
  <meta property="og:title" content="چندچندی؟ | نرخ لحظه‌ای ارز، طلا و رمزارز">
  <meta property="og:description" content="داشبورد سبک، ایستا و سریع استعلام قیمت لحظه‌ای طلا، سکه، ارز و رمزارزها">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">

  <!-- Neobrutalism Design System & Fonts -->
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/neobrutal.css?v=57">
</head>
<body>

<div class="wrap">
  <!-- Fixed Sticky Top Bar -->
  <div class="topbar" id="topbar">
            <div class="topin">
      <div class="top">
        <!-- Brand & Main Menu on the Right (Single Line) -->
        <div class="brand-nav">
          <div class="brand">
            <img src="assets/logo.svg" alt="لوگو" class="brand-logo" width="30" height="30">
            <h1>چندچندی؟</h1>
          </div>

          <nav class="tabs" role="tablist" aria-label="دسته‌بندی بازار" id="tabs">
            <button role="tab" data-tab="home" aria-selected="true">
              <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>
              <span>خلاصه</span>
            </button>
            <button role="tab" data-tab="gold" aria-selected="false">
              <svg viewBox="0 0 24 24"><path d="M3 17l3-8h12l3 8z"/><path d="M8 9l1.5-4h5L16 9"/></svg>
              <span>طلا و سکه</span>
            </button>
            <button role="tab" data-tab="fx" aria-selected="false">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>
              <span>ارز</span>
            </button>
            <button role="tab" data-tab="crypto" aria-selected="false">
              <svg viewBox="0 0 24 24"><path d="M9 4v16M13 4v16M7 8h7a2.5 2.5 0 0 1 0 5H7M7 13h8a3 3 0 0 1 0 6H7"/></svg>
              <span>رمزارز</span>
            </button>
            <button role="tab" data-tab="tools" aria-selected="false">
              <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2"/></svg>
              <span>ابزار</span>
            </button>
          </nav>
        </div>

        <!-- Action Tools on the Left -->
        <div class="tools">
          <button class="ibtn" id="btn-search" aria-label="جستجوی نماد" title="جستجو (/)">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
          </button>
          <div class="seg" role="group" aria-label="واحد قیمت">
            <button id="u-toman" aria-pressed="true">تومان</button>
            <button id="u-rial" aria-pressed="false">ریال</button>
          </div>
          <button class="ibtn" id="btn-refresh" aria-label="بروزرسانی قیمت‌ها" title="بروزرسانی قیمت‌ها">
            <svg viewBox="0 0 24 24"><path d="M21 2v6h-6"/><path d="M21 12a9 9 0 1 1-2.7-6.36L21 8"/></svg>
          </button>
          <button class="ibtn" id="btn-theme" aria-label="تغییر تم رنگی" title="تغییر تم">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v16"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
          </button>
          <button class="ibtn" id="btn-settings" aria-label="تنظیمات پروکسی و اتصال" title="تنظیمات پروکسی">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          </button>
        </div>
      </div>

      <!-- Expandable Search Bar -->
      <div class="search-bar" id="search-bar" hidden>
        <div class="search-box">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" id="search-input" placeholder="جستجوی نماد (دلار، سکه، تتر، بورس...)" autocomplete="off">
          <button id="search-clear" aria-label="بستن جستجو">✕</button>
        </div>
      </div>

      <!-- Filters Row (Sub-groups Chips First, Smart Sort Button End) -->
      <div class="filters" id="filters" hidden>
        <div class="chips" id="chips"></div>
        <div class="sort-btn" title="مرتب‌سازی">
          <svg viewBox="0 0 24 24"><path d="M3 6h18M6 12h12M10 18h4"/></svg>
          <span id="sort-cur">پیش‌فرض</span>
          <select id="sort" class="sort-select" aria-label="مرتب‌سازی">
            <option value="def">پیش‌فرض</option>
            <option value="up">بیشترین رشد</option>
            <option value="down">بیشترین افت</option>
            <option value="price">بیشترین قیمت</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Dynamic Spacer matching sticky topbar height -->
  <div id="spacer" aria-hidden="true"></div>

  <!-- Main View Container -->
  <main id="view"></main>
</div>

<!-- Settings Sheet Modal -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet-body" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h2 id="sheet-title">تنظیمات اتصال و پروکسی</h2>
    <label class="f">
      <span>آدرس پروکسی CORS اختصاصی (اختیاری)</span>
      <input id="proxy" type="url" dir="ltr" placeholder="https://your-worker.workers.dev/?url=">
    </label>
    <label class="f">
      <span>فاصله بروزرسانی خودکار نرخ‌ها</span>
      <select id="interval">
        <option value="30">۳۰ ثانیه</option>
        <option value="60">۶۰ ثانیه</option>
        <option value="120">۲ دقیقه</option>
        <option value="0">خاموش (دستی)</option>
      </select>
    </label>
    <p class="hint">به‌صورت پیش‌فرض از پروکسی پایدار کلادفلر ورکر برای اتصال استفاده می‌شود. اگر مایلید پروکسی اختصاصی خودتان را اجرا کنید، آدرس آن را وارد کنید (باید به «?url=» ختم شود).</p>
    <div class="testout" id="testout" role="status"></div>
    <div class="btns">
      <button class="btn" id="s-save">ذخیره و بارگذاری مجدد</button>
      <button class="btn ghost" id="s-test">تست اتصال</button>
      <button class="btn ghost" id="s-close">انصراف</button>
    </div>
  </div>
</div>

<!-- Detail Bottom Sheet with Interactive Chart -->
<div class="sheet" id="dsheet" hidden>
  <div class="sheet-body dtl" id="dbody" role="dialog" aria-modal="true" aria-label="نمودار و جزئیات نماد"></div>
</div>

<!-- Fallback Snapshot & Main Logic -->
<script src="js/fallback-data.js"></script>
<script src="js/app.js?v=38"></script>
<script src="js/scrollbar.js?v=1"></script>

</body>
</html>
